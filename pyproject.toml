[project]
name = "sac-capital"
version = "0.1.0"
description = "AI trading agent with verifiable on-chain decision commitments (Mantle)"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "anthropic>=0.105.2",
    "crawl4ai>=0.8.9",
    "defusedxml>=0.7.1",
    "httpx>=0.28.1",
    "openai>=2.0.0",
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.14.2",
    "scikit-learn>=1.8.0",
    "websockets>=16.0",
    "yfinance>=1.4.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project.scripts]
latency-probe = "strategies.crypto_updown.latency_probe:main"
runner = "runner:main"
runner-equities = "runner_equities:main"
runner-research = "runner_research:main"
