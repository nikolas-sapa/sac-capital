[project]
name = "polymarket-bot"
version = "0.1.0"
description = "Polymarket multi-strategy paper-trading bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28.2",
    "httpx>=0.28.1",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "websockets>=16.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0"]
